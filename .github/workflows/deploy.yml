name: Tinylink Deploy Workflow

on: workflow_dispatch

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build, Package & Trigger Render
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run tests with Maven
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: ./mvnw clean test
      
      - name: Package JAR
        run: ./mvnw package -DskipTests

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repo name
        id: repo
        run: echo "REPO_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.REPO_NAME }}:latest
            ghcr.io/${{ steps.repo.outputs.REPO_NAME }}:${{ github.sha }}

      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Deploy hook secret found. Triggering render..."
            curl -f -X POST "$RENDER_DEPLOY_HOOK_URL"
          else 
            echo "RENDER_DEPLOY_HOOK_URL is not set yet. Skipping Render deploy."
          fi