name: Tinylink Deploy Workflow

on: workflow_dispatch

jobs:
  run-test:
    name: Run Test
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Start MySQL service 
        run: |
          docker compose up -d
          # Wait for MySQL to become ready
          until docker exec tinylink_mysql mysqladmin ping -uadmin -psecret --silent; do
            echo "Waiting for database connection..."
            sleep 2
          done
      
      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Run tests with Maven
        run: ./mvnw clean test
